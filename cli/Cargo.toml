[package]
name = "vitals-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vitals"
path = "src/main.rs"

[dependencies]
vitals-core = { path = "../core" }
clap = { version = "=4.4.18", features = ["derive", "env"] }
# JSON output (--json) for agent consumption; no network implied.
serde = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", optional = true }

[features]
default = []
# HTTP client mode against a running vitals-server (--server URL).
client = ["dep:ureq"]
encryption = ["vitals-core/encryption"]
