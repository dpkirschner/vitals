[package]
name = "vitals-oura"
version = "0.1.0"
edition = "2021"
description = "Oura ring sync for vitals: OAuth and HTTP (core stays network-free)"

[dependencies]
vitals-core = { path = "../core" }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
base64 = "0.22"

